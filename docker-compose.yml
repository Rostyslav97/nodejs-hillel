services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_app_node_mongo
    ports:
      - "${PORT:-4500}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=${PORT}
      - MONGO_URL=${MONGO_URL}
    
    depends_on:
      - mongo

    command: npm run dev

  mongo:
    image: mongo:8
    container_name: web_mongo_node_mongo
    ports:
      - "${MONGO_PORT:-27317}:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: